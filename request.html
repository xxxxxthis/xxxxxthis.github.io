<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090c0a"><title>PEPE RESTAURANT · 초대 요청</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=1.3.9a"></head>
<body><main class="portal">
<div class="portal-top"><b>🐸 PEPE RESTAURANT</b><a href="index.html">← 홈페이지</a></div>
<section class="portal-card">
<small>INVITE REQUEST</small><h1>Discord 초대 요청</h1>
<p>PEPE RESTAURANT 초대 링크는 공개하지 않습니다. Discord 계정 확인 후 요청을 제출하면 운영진 승인 뒤 이 페이지에서 초대 링크를 확인할 수 있습니다.</p>
<div id="login-box"><button class="portal-button" id="invite-login">Discord 계정으로 요청하기</button></div>
<div id="request-box" hidden>
<p><b id="request-user">Discord 인증 완료</b></p>
<textarea id="request-reason" class="portal-input" maxlength="500" placeholder="가입하고 싶은 이유를 간단하게 적어주세요."></textarea>
<button class="portal-button" id="submit-request">초대 요청 제출</button>
<button class="portal-button secondary" id="refresh-request">승인 상태 새로고침</button>
<div class="portal-status" id="request-status">상태 확인 중...</div>
</div>
</section></main>
<script src="config.js?v=1.3.9a"></script><script src="request.js"></script></body></html>
