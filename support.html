<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090c0a">
  <title>PEPE SUPPORT CENTER</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=1.5.0-final">
  <style>
    .support-shell{max-width:900px;margin:0 auto;padding:70px 22px 120px}.support-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.support-top a{color:#b8ff5a;text-decoration:none;font-weight:800}.support-card{background:#101512;border:1px solid #222b24;border-radius:22px;padding:30px;margin-top:16px}.support-card h1{font-size:clamp(42px,7vw,72px);line-height:.95;letter-spacing:-.055em;margin:14px 0 18px}.support-card h2{font-size:30px;margin:5px 0 18px}.support-card p{color:#929c94;line-height:1.7}.support-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.support-field{display:grid;gap:7px;margin-top:14px}.support-field label{font-size:12px;font-weight:800;color:#adb7af}.support-field input,.support-field select,.support-field textarea{width:100%;background:#0b0f0c;color:#eef5ef;border:1px solid #283029;border-radius:12px;padding:13px;font:inherit}.support-field textarea{min-height:180px;resize:vertical}.support-field.full{grid-column:1/-1}.support-actions{display:flex;gap:10px;margin-top:18px}.support-result{margin-top:18px;padding:16px;border:1px solid #283229;border-radius:12px;background:#0b0f0c;display:none}.support-result.show{display:block}.support-ticket{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#b8ff5a;font-weight:900}.support-state{display:inline-block;border:1px solid #344036;border-radius:999px;padding:4px 9px;font-size:11px;color:#b8ff5a}.support-reply{white-space:pre-wrap;background:#111713;border-radius:10px;padding:14px;margin-top:12px;color:#dce5de}.support-tabs{display:flex;gap:8px;margin:20px 0 6px}.support-tab{background:#111713;color:#8d988f;border:1px solid #222b24;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:800}.support-tab.active{background:#b8ff5a;color:#091006;border-color:#b8ff5a}.support-pane{display:none}.support-pane.active{display:block}.support-note{font-size:12px;color:#707b72!important}.support-error{color:#ff8d8d!important}.support-ok{color:#b8ff5a!important}@media(max-width:650px){.support-grid{grid-template-columns:1fr}.support-field.full{grid-column:auto}.support-actions{flex-direction:column}.support-actions button{width:100%}}
  </style>
</head>
<body>
  <main class="support-shell">
    <div class="support-top"><a href="index.html">🐸 PEPE RESTAURANT</a><a href="index.html">← 홈페이지</a></div>
    <section class="support-card">
      <small>PEPE SUPPORT CENTER · 1.0</small>
      <h1>무엇을 도와드릴까요?</h1>
      <p>일반 문의부터 Discord · Minecraft · 버그 신고까지 한곳에서 접수할 수 있습니다. 접수 후 발급되는 문의번호로 처리 상태와 운영진 답변을 확인하세요.</p>
      <div class="support-tabs">
        <button class="support-tab active" data-support-tab="write" type="button">📨 문의 접수</button>
        <button class="support-tab" data-support-tab="lookup" type="button">🔎 문의 조회</button>
      </div>
      <div class="support-pane active" data-support-pane="write">
        <form id="support-form">
          <div class="support-grid">
            <div class="support-field"><label for="support-category">문의 유형</label><select id="support-category" required><option>일반 문의</option><option>신고</option><option>Minecraft</option><option>Discord 초대</option><option>버그</option><option>기타</option></select></div>
            <div class="support-field"><label for="support-discord">Discord 이름 / 사용자명</label><input id="support-discord" maxlength="80" placeholder="예: Math" autocomplete="off"></div>
            <div class="support-field full"><label for="support-title">제목</label><input id="support-title" maxlength="120" minlength="2" required placeholder="문의 제목을 입력하세요"></div>
            <div class="support-field full"><label for="support-content">내용</label><textarea id="support-content" maxlength="3000" minlength="5" required placeholder="문의 내용을 자세히 작성해주세요."></textarea></div>
          </div>
          <p class="support-note">※ 비밀번호, 인증 토큰 등 민감한 정보는 입력하지 마세요.</p>
          <div class="support-actions"><button class="portal-button" id="support-submit" type="submit">문의 접수하기</button></div>
        </form>
        <div class="support-result" id="support-submit-result"></div>
      </div>
      <div class="support-pane" data-support-pane="lookup">
        <div class="support-field"><label for="support-ticket-id">문의번호</label><input id="support-ticket-id" placeholder="PS-20260825-0001" autocomplete="off"></div>
        <div class="support-actions"><button class="portal-button secondary" id="support-lookup" type="button">문의 상태 조회</button></div>
        <div class="support-result" id="support-lookup-result"></div>
      </div>
    </section>
  </main>
  <script src="config.js?v=1.5.0-final"></script>
  <script src="support.js?v=1.0.0"></script>
</body>
</html>
